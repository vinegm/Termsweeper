# This are all the settings you can configure in a theme file.
# all values in here are the default values, but you can omit any of these and it will just use the defaults instead.
# empty values for colors will use the defaults/terminal colors.
# WARN: This file must represent the default
# values used in internal/config/config.go.

board:
  rows: 16
  cols: 16
  mines: 40

behaviour:
  # Minimum rows/columns kept visible between the cursor and the viewport edge
  # when scrolling, like nvim's 'scrolloff'/'sidescrolloff'. Only matters on
  # boards bigger than the terminal.
  scrolloff: 0
  sidescrolloff: 0

layout:
  # highlight and number allow for directional control of their feature:
  # Any of "left", "right", "top", "bottom", or a list of them, e.g. [left, top].
  # "horizontal" = [left, right], "vertical" = [top, bottom], "all" = every side,
  # "" or "none" to disable.
  highlight: "" # lights up the cells in those directions from the cursor
  numbers: "" # shows the coordenate of the square in the gutter

  relative_line_numbers: false # if true, row numbers show distance from the cursor's row, like nvim's relativenumber
  relative_column_numbers: false # if true, column numbers show distance from the cursor's column

chars:
  flag: "F"
  mine: "X"
  unrevealed: " "

theme:
  fg: "" # Used as the default fg color for all text, and fg color for squares if not set in their specific style
  bg: "" # Used as the default bg color for the window and squares if not set in their specific style
  selected: "#5a5a5a" # Used as fg color for selected text and bg color for selected square
  border: "" # Missing a field is also fine, will use defaults/terminal colors

  label:
    fg: "" # fg color for row/column numbers not on the cursor's row/column
    highlight: "" # fg color for the row/column number on the cursor's row/column

  # bg colors for the squares lit up by layout.highlight
  highlight:
    even: "#3a3a3a"
    odd: "#454545"

  # each style can set `fg` and `bg`, defaulting to theme.fg and theme.bg if omitted
  squares:
    even:
      fg: ""
      bg: "#1C2B1C"
    odd:
      fg: ""
      bg: "#263726"
    flagged:
      fg: "#FFD580"
      bg: ""
    mined:
      fg: "#800000"
      bg: ""
    exploded: # defaults to squares.mined if omitted
      fg: ""
      bg: ""

    # list of styles by adjacent mine count, in order
    hints:
      # revealed (0 adjacent mines)
      - fg: ""
        bg: ""
      # 1-8 adjacent mines
      - fg: ""
        bg: ""
      - fg: ""
        bg: ""
      - fg: ""
        bg: ""
      - fg: ""
        bg: ""
      - fg: ""
        bg: ""
      - fg: ""
        bg: ""
      - fg: ""
        bg: ""
      - fg: ""
        bg: ""

  preserve_grid_bg:
    revealed: false # if true, revealed squares will use the same bg color odd/even squares
    flag: true # if true, flagged squares will use the same bg color odd/even squares
    mine: true # if true, mined squares will use the same bg color odd/even squares
